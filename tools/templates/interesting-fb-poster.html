<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0b0b0b;color:#ECE5D6;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.bg{position:absolute;left:0;top:0;width:1080px;height:1080px;background:radial-gradient(circle at 50% 38%,#3a3a3a 0%,#1c1c1c 38%,#0b0b0b 72%)}
.pt{position:absolute;left:0;top:-10px;width:1080px;height:1080px}
.fade{position:absolute;left:0;top:760px;width:1080px;height:340px;background:linear-gradient(180deg,rgba(11,11,11,0) 0%,rgba(11,11,11,.85) 55%,#0b0b0b 100%)}
.grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:screen}
.stamp{position:absolute;left:56px;top:52px;font:400 30px Anton;letter-spacing:.12em;color:#E5483E;border:4px solid #E5483E;padding:4px 14px 2px;transform:rotate(-3deg);border-radius:4px;background:rgba(11,11,11,.55)}
h1{position:absolute;left:56px;right:56px;top:905px;font:400 84px/0.98 Anton;text-transform:uppercase}
h1 .hl{position:relative;display:inline-block;color:#fff;z-index:0}
h1 .hl:before{content:"";position:absolute;left:-10px;right:-12px;top:14%;bottom:6%;background:#7B3FE4;z-index:-1;transform:rotate(-1.2deg);border-radius:10px 4px 12px 6px}
.strip{position:absolute;left:56px;right:56px;top:1104px;display:flex;gap:12px}
.c{flex:1;border:2px solid #2e2b27;padding:12px 16px 10px}
.c .v{font:400 50px/1 Anton}
.c .l{font:700 17px/1.25 Inter;color:#a59f92;margin-top:6px;letter-spacing:.02em}
.c.win{border-color:#3DBE6E}.c.win .v{color:#3DBE6E}
.c.lose .v{color:#E5483E}
.take{position:absolute;left:56px;right:56px;bottom:40px;display:flex;align-items:center;gap:16px}
.take img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid #ECE5D6}
.take p{font:400 34px Anton;text-transform:uppercase;letter-spacing:.01em}
</style></head><body>
<div class="bg"></div>
<img class="pt" src="sbf-gray.png">
<div class="fade"></div>
<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .35 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="stamp">INTERESTING</div>
<h1>SBF's $500M Anthropic bet<br>is now worth <span class="hl">$37 billion</span></h1>
<div class="strip">
 <div class="c"><div class="v">$500M</div><div class="l">2022: ALAMEDA BUYS ~7.8%</div></div>
 <div class="c lose"><div class="v">$1.34B</div><div class="l">2024: FTX ESTATE SELLS IT ALL</div></div>
 <div class="c win"><div class="v">$37B</div><div class="l">NOW: SAME STAKE AT $83 IPO</div></div>
</div>
<div class="take"><img src="../../assets/zs-avatar.jpg"><p>His best bet ever. Cashed by everyone else.</p></div>
</body></html>
