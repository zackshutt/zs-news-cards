<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0b0b0b;color:#ECE5D6;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,#3a3a3a 0%,#1b1b1b 34%,#0b0b0b 66%)}
.pt{position:absolute;left:0;top:215px;width:1080px;height:1080px}
.topfade{position:absolute;left:0;right:0;top:0;height:400px;background:linear-gradient(180deg,#0b0b0b 0%,#0b0b0b 50%,rgba(11,11,11,0) 100%)}
.botfade{position:absolute;left:0;right:0;top:960px;bottom:0;background:linear-gradient(180deg,rgba(11,11,11,0) 0%,rgba(11,11,11,.92) 30%,#0b0b0b 55%)}
.alert{position:absolute;left:50%;transform:translateX(-50%);top:44px;background:#E3121B;color:#fff;font:400 34px/1 Anton;letter-spacing:.06em;padding:12px 22px 10px;border-radius:999px;white-space:nowrap}
.alert span{font-family:'Noto Color Emoji';font-size:28px;vertical-align:2px}
h1{position:absolute;left:40px;right:40px;top:122px;text-align:center;font:400 86px/1 Anton;text-transform:uppercase;white-space:nowrap}
h1 em{font-style:normal;color:#3DBE6E}
.cmp{position:absolute;left:40px;right:40px;top:1060px;display:flex;align-items:flex-end;justify-content:center;gap:26px}
.cell{text-align:center}
.cell .v{font:400 112px/1 Anton}
.cell .l{font:800 21px Inter;letter-spacing:.12em;margin-top:6px;color:#a59f92}
.arr{font:400 72px/1 Anton;color:#5f5a51;padding-bottom:40px}
.g .v{color:#3DBE6E}.r .v{color:#E5483E}.r .l{color:#E5483E}
.take{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;align-items:center;gap:14px}
.take img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid #ECE5D6}
.take p{font:400 32px Anton;text-transform:uppercase;letter-spacing:.01em}
</style></head><body>
<div class="bg"></div>
<img class="pt" src="sbf-gray.png">
<div class="topfade"></div><div class="botfade"></div>
<div class="alert"><span>🚨</span> BIG DOOFUS ALERT <span>🚨</span></div>
<h1>SBF bet $500M on Anthropic.<br>It's now worth <em>$37 billion.</em></h1>
<div class="cmp">
 <div class="cell"><div class="v">$500M</div><div class="l">PUT IN (2022)</div></div>
 <div class="arr">→</div>
 <div class="cell g"><div class="v">$37B</div><div class="l">WORTH TODAY</div></div>
 <div class="arr">→</div>
 <div class="cell r"><div class="v">$0</div><div class="l">WHAT HE GETS</div></div>
</div>
<div class="take"><img src="../../assets/zs-avatar.jpg"><p>Great at investing. Just not with his own money.</p></div>
</body></html>
