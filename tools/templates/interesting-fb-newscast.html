<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0b0b0b;color:#fff;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#3c3c3c 0%,#1d1d1d 36%,#0b0b0b 70%)}
.pt{position:absolute;left:-30px;top:20px;width:1140px;height:1140px}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,rgba(0,0,0,0) 2px 4px)}
.bug{position:absolute;left:40px;top:40px;display:flex;font:400 30px/1 Anton;letter-spacing:.06em}
.bug .live{background:#E3121B;padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.bug .live i{width:14px;height:14px;border-radius:50%;background:#fff;display:block}
.bug .net{background:rgba(255,255,255,.95);color:#111;padding:10px 16px 8px}
.lt{position:absolute;left:40px;right:40px;top:930px}
.tab{display:inline-flex;align-items:center;gap:12px;background:#FFD400;color:#111;font:400 40px/1 Anton;letter-spacing:.05em;padding:12px 22px 10px}
.tab b{font-weight:400;background:#111;color:#FFD400;padding:4px 10px 2px;font-size:30px}
.hl{background:#fff;color:#0b0b0b;font:400 70px/1 Anton;text-transform:uppercase;padding:20px 26px 16px;letter-spacing:.005em}
.hl em{font-style:normal;color:#fff;background:#E3121B;padding:6px 12px 2px;display:inline-block;line-height:.92;margin-top:4px}
.sub{background:#111;border-left:10px solid #E3121B;display:flex;align-items:center;gap:16px;padding:14px 20px}
.sub img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.sub p{font:400 32px/1.05 Anton;text-transform:uppercase;letter-spacing:.01em}
.sub small{display:block;font:700 15px Inter;letter-spacing:.14em;color:#FFD400;margin-bottom:5px}
.tick{position:absolute;left:0;right:0;bottom:0;height:78px;background:#0f1d3d;display:flex;align-items:center;border-top:4px solid #E3121B}
.tick .k{background:#E3121B;height:100%;display:flex;align-items:center;padding:0 22px;font:400 30px Anton;letter-spacing:.05em}
.tick .t{white-space:nowrap;font:700 27px Inter;padding-left:24px;letter-spacing:.01em}
.tick .t b{color:#FFD400;font-family:Anton;font-weight:400;font-size:32px}
.tick .t span{color:#7d8bb0;padding:0 14px}
</style></head><body>
<div class="bg"></div>
<img class="pt" src="sbf-gray.png">
<div class="vig"></div><div class="scan"></div>
<div class="bug"><div class="live"><i></i>LIVE</div><div class="net">DOOFUS NEWS</div></div>
<div class="lt">
 <div class="tab">⚠ BIG DOOFUS ALERT <b>BREAKING</b></div>
 <div class="hl">SBF's $500M Anthropic bet<br>is now worth <em>$37 billion</em></div>
 <div class="sub"><img src="../../assets/zs-avatar.jpg"><div><small>ZACK'S TAKE</small><p>Great at investing. Just not with his own money.</p></div></div>
</div>
<div class="tick"><div class="k">SBF</div><div class="t"><b>$500M</b> IN (2022) <span>●</span> SOLD FOR <b>$1.34B</b> (2024) <span>●</span> NOW <b>$37B</b></div></div>
</body></html>
